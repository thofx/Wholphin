# Nova: release of this fork's own build.
# Push a tag like nova-v1 on the nova branch to build a signed APK and publish a GitHub release.
# Kept in its own file so upstream's workflows stay untouched.
name: Nova release

on:
  push:
    tags:
      - nova-v*

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"
  TAG_NAME: ${{ github.ref_name }}
  UPSTREAM_REPO: https://github.com/damontecres/Wholphin.git

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The version name and code come from upstream's v* tags, which the fork does not have
      - name: Fetch upstream version tags
        run: |
          git fetch --no-tags "$UPSTREAM_REPO" '+refs/tags/v*:refs/tags/v*'
          echo "VERSION_NAME=$(git describe --tags --long --match 'v*')" >> "$GITHUB_ENV"

      # Without the extensions credentials the build silently drops the FFmpeg/AV1 decoders,
      # so fail instead of publishing an incomplete app
      - name: Check secrets
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          EXTENSIONS_USERNAME: "${{ secrets.EXTENSIONS_USERNAME }}"
          EXTENSIONS_PASSWORD: "${{ secrets.EXTENSIONS_PASSWORD }}"
        run: |
          if [[ -z "$KEY_ALIAS" || -z "$SIGNING_KEY" ]]; then
            echo "::error::Missing signing secrets: KEY_ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD, SIGNING_KEY"
            exit 1
          fi
          if [[ -z "$EXTENSIONS_USERNAME" || -z "$EXTENSIONS_PASSWORD" ]]; then
            echo "::error::Missing EXTENSIONS_USERNAME / EXTENSIONS_PASSWORD (a token with read:packages, for FFmpeg and AV1)"
            exit 1
          fi

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build app
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsUsername: "${{ secrets.EXTENSIONS_USERNAME }}"
          ORG_GRADLE_PROJECT_WholphinExtensionsPassword: "${{ secrets.EXTENSIONS_PASSWORD }}"
        run: ./gradlew clean assembleDefaultRelease

      - name: Check native libraries
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              for lib in libvlc.so libffmpegJNI.so libdav1dJNI.so; do
                if ! unzip -l "$apk" | grep -q "/$lib"; then
                  echo "::error::$lib missing from $(basename "$apk")"
                  exit 1
                fi
              done
            done

      - name: Verify signatures
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            xargs -0 -n1 "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner" verify --verbose --print-certs

      # The in-app updater looks for these names, like upstream's releases:
      # Wholphin-default-release-0.6.2-15-gabc1234-140-arm64-v8a.apk => Wholphin-arm64-v8a.apk
      - name: Rename APKs
        run: |
          mkdir -p release
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              name="$(basename "$apk" | sed -E 's/-default-release-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-g[a-fA-F0-9]+-[0-9]+//')"
              cp "$apk" "release/$name"
            done
          sha256sum release/*.apk

      - name: Upload mapping files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mapping
          path: app/build/outputs/**/mapping.txt
          compression-level: 6

      # The in-app updater parses the release title as the version (vX.Y.Z or vX.Y.Z-N-gHASH)
      # and compares it with the installed one, so the title must be the version name
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$VERSION_NAME" \
            --verify-tag \
            --latest \
            --generate-notes \
            release/*.apk
